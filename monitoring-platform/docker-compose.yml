name: monitoring-${TENANT}

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    environment:
      # Required so --enable-feature=expand-external-labels can expand ${TENANT}
      TENANT: ${TENANT}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE}
      - --enable-feature=expand-external-labels
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager:/etc/alertmanager
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:${LOKI_VERSION}
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # Opt-in: only starts when the `mongodb` profile is enabled
  # (COMPOSE_PROFILES=mongodb in .env, or `docker compose --profile mongodb up`).
  mongodb-exporter:
    image: percona/mongodb_exporter:${MONGODB_EXPORTER_VERSION}
    restart: unless-stopped
    profiles: [mongodb]
    command:
      - --mongodb.uri=${MONGODB_URI}
      - --collect-all
    ports:
      - "9216:9216"

  # SQL Server monitoring via the community sql_exporter.
  # Config (with the DSN secret) is rendered from mssql/sql_exporter.yml.tmpl by deploy.sh.
  mssql-exporter:
    image: burningalchemist/sql_exporter:${MSSQL_EXPORTER_VERSION}
    restart: unless-stopped
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
    volumes:
      - ./mssql:/etc/sql_exporter
    ports:
      - "9399:9399"

  snmp-exporter:
    image: prom/snmp-exporter:${SNMP_EXPORTER_VERSION}
    restart: unless-stopped
    volumes:
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml
    ports:
      - "9116:9116"

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    ports:
      - "9115:9115"

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
