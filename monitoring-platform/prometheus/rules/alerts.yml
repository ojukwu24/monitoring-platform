groups:
  - name: host
    rules:
      - alert: HostDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} ({{ $labels.job }}) is down"

      - alert: DiskFillingUp
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk <10% free on {{ $labels.instance }} ({{ $labels.mountpoint }})"

      - alert: HighMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory >90% on {{ $labels.instance }}"

  - name: windows
    rules:
      - alert: WindowsDiskFillingUp
        expr: |
          (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Windows disk <10% free on {{ $labels.instance }} ({{ $labels.volume }})"

  - name: mongodb
    rules:
      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB exporter cannot reach MongoDB ({{ $labels.instance }})"

  - name: mssql
    rules:
      - alert: MSSQLDown
        expr: mssql_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SQL Server unreachable via sql_exporter ({{ $labels.instance }})"

      - alert: MSSQLLowPageLifeExpectancy
        # <300s is a common (rough) memory-pressure heuristic; tune per workload.
        expr: mssql_page_life_expectancy < 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SQL Server page life expectancy low ({{ $value }}s) on {{ $labels.instance }}"

      - alert: MSSQLLowBufferCacheHitRatio
        expr: mssql_buffer_cache_hit_ratio < 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SQL Server buffer cache hit ratio {{ $value }}% on {{ $labels.instance }}"

  - name: endpoints
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} probe failing"

      - alert: TLSCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 86400 * 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires in <14 days"

  - name: apis
    rules:
      - alert: ApiDown
        expr: probe_success{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API {{ $labels.api }} is failing ({{ $labels.instance }})"

      - alert: ApiUnauthorized
        # 401/403 usually means the API key expired or was revoked.
        expr: probe_http_status_code{job="api"} == 401 or probe_http_status_code{job="api"} == 403
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API {{ $labels.api }} returned {{ $value }} — check its API key"

      - alert: ApiSlow
        expr: probe_duration_seconds{job="api"} > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API {{ $labels.api }} responding slowly ({{ $value }}s)"

  - name: kubernetes
    rules:
      - alert: KubePodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crash-looping"
