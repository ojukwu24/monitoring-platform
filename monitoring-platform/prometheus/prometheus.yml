global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    # Expanded from the TENANT env var via --enable-feature=expand-external-labels.
    # Applied to all metrics on export/remote_write — the migration path to Mimir.
    tenant: ${TENANT}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # File-based service discovery for direct targets (node, windows, mongodb,
  # kubernetes). Files are listed explicitly — NOT globbed — so the SNMP and
  # blackbox target files, which need their own multi-target jobs below, are
  # not also scraped here as plain targets.
  - job_name: file_sd
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node.yml
          - /etc/prometheus/targets/windows.yml
          - /etc/prometheus/targets/kubernetes.yml
          # MongoDB is opt-in — enable the `mongodb` compose profile and add
          # /etc/prometheus/targets/mongodb.yml here to scrape it.

  # SQL Server: one exporter serving MANY SQL Servers. The exporter attaches its
  # own `instance` label (the name from mssql/servers.conf) to each server's
  # metrics, so honor_labels keeps those names instead of overwriting them with
  # the exporter's own address.
  - job_name: mssql
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mssql.yml
    # One exporter serves every SQL Server, so `env` can't come from the target
    # file — derive it from the server name instead (prod-sql-01 -> env=prod).
    # Names that don't start with an environment simply get no env label.
    metric_relabel_configs:
      - source_labels: [instance]
        regex: '(prod|production|stage|staging|uat|test|dev)[-_].*'
        target_label: env
        replacement: '$1'

  # SNMP: multi-target exporter pattern. Prometheus passes each device as
  # ?target= to snmp-exporter, which does the SNMP walk.
  - job_name: snmp
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/snmp.yml
    metrics_path: /snmp
    params:
      module: [if_mib]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # API endpoints: same blackbox exporter, but each API uses its own module so it
  # can send its own auth header (API key / bearer token). Probed every 60s.
  # Both files are generated by scripts/render-api-config.sh from blackbox/apis.conf.
  - job_name: api
    scrape_interval: 60s
    scrape_timeout: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/api.yml
    metrics_path: /probe
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]          # per-API blackbox module
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - action: labeldrop                # keep `api` label, drop the plumbing one
        regex: module
      - target_label: __address__
        replacement: blackbox-exporter:9115
    # Derive env from the API name (prod-payments-api -> env=prod).
    metric_relabel_configs:
      - source_labels: [api]
        regex: '(prod|production|stage|staging|uat|test|dev)[-_].*'
        target_label: env
        replacement: '$1'

  # Blackbox: uptime/synthetic probes, also multi-target.
  - job_name: blackbox
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox.yml
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
